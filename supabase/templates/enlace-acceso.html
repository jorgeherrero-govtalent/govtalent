<!DOCTYPE html>
<html lang="es">
  <body bgcolor="#f0efe9" style="margin:0;padding:0;background-color:#f0efe9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <span style="display:none;font-size:1px;color:#f0efe9;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">Entra en GovTalent con un clic</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f0efe9" style="background-color:#f0efe9;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td valign="top" style="padding:40px 12px 26px 40px;">
                      <div style="font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#5a47dc;margin:0 0 14px;">Acceso</div>
                      <div style="font-size:38px;line-height:1.08;font-weight:700;letter-spacing:-1.1px;color:#1a1a18;margin:0;">Tu enlace para entrar</div>
                    </td>
                    <td width="136" valign="top" align="right" style="padding:52px 40px 0 0;width:96px;">
                      <img src="https://govtalent.app/govtalent-isotipo-gris-email.png" width="96" height="85" alt="" style="display:block;border:0;outline:none;" />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:4px 40px 40px;color:#3a3a36;font-size:15px;line-height:1.6;">
                
    <p style="margin:0 0 14px;font-weight:600;color:#1a1a18;">Hola:</p>
<p>Usa este enlace para entrar en tu cuenta de GovTalent:</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:separate;margin:22px 0;"><tr><td bgcolor="#6d5aef" style="background-color:#6d5aef;border-radius:8px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#6d5aef;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:500;">Entrar en GovTalent</a></td></tr></table>
<p style="margin:0 0 6px;">O introduce este código:</p>
<div style="margin:22px 0;padding:16px 20px;background-color:#f0eefe;border-radius:10px;font-size:28px;font-weight:700;letter-spacing:6px;color:#1a1a18;text-align:center;">{{ .Token }}</div>
<p style="margin:0;font-size:12.5px;color:#8b8780;">Si no has pedido entrar en GovTalent, puedes ignorar este correo.</p>
</td></tr></table>
  
              </td>
            </tr>
            <tr>
              <td bgcolor="#1a1a18" style="background-color:#1a1a18;padding:26px 40px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding-bottom:18px;border-bottom:1px solid #3a3a36;">
                      <img src="https://govtalent.app/govtalent-logo-blanco-email.png" width="128" height="22" alt="GovTalent" style="display:block;border:0;outline:none;text-decoration:none;" />
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:16px 0 26px;font-size:11.5px;color:#a8a49c;line-height:1.7;text-align:center;">
                      © GovTalent<br/>
                      <a href="https://govtalent.app/privacidad" style="color:#c9c6be;">Privacidad</a> ·
                      <a href="https://govtalent.app/condiciones" style="color:#c9c6be;">Condiciones</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
